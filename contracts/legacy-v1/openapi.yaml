components:
  schemas:
    Project:
      type: object
      required:
      - id
      - name
      - repositoryPath
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name: &id001
          type: string
          minLength: 1
        repositoryPath: &id002
          type: string
        createdAt:
          type: string
          format: date-time
    Run:
      type: object
      required:
      - id
      - projectId
      - goal
      - createdAt
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        projectId: &id003
          type: string
          format: uuid
        goal: &id004
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        status: &id006
          type: string
          enum:
          - DRAFT
          - PLANNING
          - RUNNING
          - WAITING
          - PAUSED
          - REVIEWING
          - COMPLETED
          - FAILED
          - CANCELLED
          - INTERRUPTED
        version: &id005
          type: integer
          minimum: 0
    SpecificationRevision:
      type: object
      required:
      - id
      - runId
      - revision
      - content
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        content: &id007
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
    Task:
      type: object
      required:
      - id
      - projectId
      - runId
      - title
      - acceptanceCriteria
      - dependencyIds
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        projectId: &id008
          type: string
          format: uuid
        runId: &id009
          type: string
          format: uuid
        title: &id010
          type: string
          minLength: 1
        acceptanceCriteria: &id011
          type: array
          items:
            type: string
          minItems: 1
        dependencyIds: &id012
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - code
      - message
      - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
    CreateProject:
      type: object
      required:
      - name
      - repositoryPath
      properties:
        name: *id001
        repositoryPath: *id002
    CreateRun:
      type: object
      required:
      - projectId
      - goal
      properties:
        projectId: *id003
        goal: *id004
    ChangeRunStatus:
      type: object
      required:
      - expectedVersion
      - status
      properties:
        expectedVersion: *id005
        status: *id006
    AddSpecificationRevision:
      type: object
      required:
      - content
      properties:
        content: *id007
    CreateTask:
      type: object
      required:
      - projectId
      - runId
      - title
      - acceptanceCriteria
      - dependencyIds
      properties:
        projectId: *id008
        runId: *id009
        title: *id010
        acceptanceCriteria: *id011
        dependencyIds: *id012
    Health:
      type: object
      required:
      - status
      properties:
        status:
          const: UP
