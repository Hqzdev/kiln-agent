  "components": {
    "securitySchemes": {
      "Session": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Command": {
        "title": "Blot command v2",
        "type": "object",
        "required": [
          "schemaVersion",
          "commandId",
          "type",
          "payload"
        ],
        "properties": {
          "schemaVersion": {
            "const": 2
          },
          "commandId": {
            "type": "string",
            "format": "uuid"
          },
          "type": {
            "enum": [
              "project.create",
              "project.archive",
              "project.delete",
              "conversation.create",
              "conversation.send_message",
              "generation.cancel",
              "generation.retry",
              "memory.save",
              "memory.delete",
              "provider.settings",
              "device.pair",
              "device.approve",
              "device.revoke",
              "budget.increase",
              "profile.save",
              "run.create",
              "run.plan.approve",
              "run.pause",
              "run.resume",
              "run.stop",
              "run.steer",
              "run.accept",
              "task.retry",
              "permission.grant",
              "permission.deny",
              "permission.revoke",
              "user.answer",
              "skill.save",
              "skill.delete",
              "automation.save",
              "automation.delete",
              "git.prepare_commit",
              "git.prepare_push",
              "git.execute",
              "git.reconcile",
              "tool.reconcile",
              "tool.abandon"
            ]
          },
          "projectId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "expectedVersion": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "payload": {
            "type": "object"
          }
        },
        "additionalProperties": false
      },
      "Event": {
        "title": "Blot persisted event v2",
        "type": "object",
        "required": [
          "schemaVersion",
          "seq",
          "eventId",
          "projectId",
          "type",
          "occurredAt",
          "payload"
        ],
        "properties": {
          "schemaVersion": {
            "const": 2
          },
          "seq": {
            "type": "string",
            "pattern": "^[1-9][0-9]*$"
          },
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "projectId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "type": {
            "type": "string"
          },
          "occurredAt": {
            "type": "string",
            "format": "date-time"
          },
          "payload": {}
        },
        "additionalProperties": false
      },
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "details": {
            "type": "object"
          }
        }
      },
      "Entity": {
        "type": "object",
        "required": [
          "id",
          "ownerId",
          "version",
          "data"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "ownerId": {
            "type": "string",
            "format": "uuid"
          },
          "projectId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "parentId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "minimum": 0
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "data": {}
        }
      },
      "Receipt": {
        "type": "object",
        "required": [
          "commandId",
          "decision",
          "operationId",
          "result"
        ],
        "properties": {
          "commandId": {
            "type": "string",
            "format": "uuid"
          },
          "decision": {
            "const": "accepted"
          },
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "result": {}
        }
      }
    }
  }
}
