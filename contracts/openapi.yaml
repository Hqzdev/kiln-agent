          },
          {
            "in": "query",
            "name": "limit",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 500
            }
          },
          {
            "in": "path",
            "name": "kind",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Курсор из nextCursors snapshot; последующие страницы SDK вычисляет из createdAt и id последней записи. Нельзя совмещать с offset.",
            "schema": {
              "type": "string",
              "maxLength": 256
            }
          }
        ]
      }
    },
