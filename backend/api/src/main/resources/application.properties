server.address=127.0.0.1
server.port=8080
spring.main.banner-mode=off

blot.data-directory=${BLOT_DATA_DIRECTORY:${user.home}/Library/Application Support/Blot/local}
blot.database=${BLOT_DATABASE:${blot.data-directory}/database/blot.db}
blot.artifacts=${blot.data-directory}/artifacts
blot.workspaces=${blot.data-directory}/workspaces
logging.file.name=${blot.data-directory}/logs/backend.log
logging.logback.rollingpolicy.max-file-size=8MB
logging.logback.rollingpolicy.max-history=8
spring.servlet.multipart.max-file-size=16MB
server.max-http-request-header-size=16KB
