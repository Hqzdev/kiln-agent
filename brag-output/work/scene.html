<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"JBM";src:url(jetbrains-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"JBM";src:url(jetbrains-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
*{box-sizing:border-box}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#ECECEC;-webkit-font-smoothing:antialiased}
canvas{position:absolute;inset:0}
.layer{position:absolute;inset:0;pointer-events:none}
#ui{perspective:1700px;perspective-origin:960px 540px}
.panel{position:absolute;left:0;top:0;background:#171717;border:1px solid rgba(255,255,255,.11);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden;transform-origin:50% 50%;will-change:transform}
.ph{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08);font:500 12px JBM;letter-spacing:.04em;color:#A1A1A1;text-transform:uppercase}
.ph i{width:6px;height:6px;border-radius:3px;background:#6E6E6E;display:inline-block}
.ph .sp{flex:1}
.mono{font-family:JBM}
.pb{padding:14px}
.badge{font:500 11px JBM;padding:3px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.12);color:#A1A1A1;text-transform:none;letter-spacing:0}
.badge.run{color:#F5A13C;border-color:rgba(245,161,60,.35);background:rgba(245,161,60,.08)}
.badge.ok{color:#4CC38A;border-color:rgba(76,195,138,.35);background:rgba(76,195,138,.08)}
.row{display:flex;align-items:center;gap:10px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;flex:1}
.bar b{display:block;height:100%;background:#ECECEC;border-radius:3px}
.bar b.a{background:#F5A13C}.bar b.g{background:#4CC38A}
.t2{color:#A1A1A1}.t3{color:#6E6E6E}
.code{font:400 14px/23px JBM;color:#C9C9C9;white-space:pre}
.kw{color:#F5A13C}.ty{color:#ECECEC}.cm{color:#6E6E6E}.st{color:#4CC38A}
.caret{display:inline-block;width:8px;height:16px;background:#F5A13C;vertical-align:-3px}
/* titles */
.title{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
#caption{position:absolute;left:0;right:0;bottom:64px;text-align:center;font:400 24px JBM;color:#A1A1A1;letter-spacing:.01em}
/* light bento */
#light{position:absolute;inset:0;background:#F4F4F6;color:#0D0D0D}
.lc{position:absolute;background:#fff;border-radius:28px;box-shadow:0 1px 2px #0000000f,0 1px 3px #0000001a;overflow:hidden}
.lbl{font:500 12px JBM;letter-spacing:.06em;text-transform:uppercase;color:#8F8F8F;display:flex;align-items:center;gap:8px}
.lbl i{width:6px;height:6px;border-radius:3px;background:#E5484D;display:inline-block}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#black{position:absolute;inset:0;background:#000;opacity:0}
</style></head>
<body><div id="stage">
<canvas id="bg" width="1920" height="1080"></canvas>
<canvas id="fx" width="1920" height="1080"></canvas>
<div id="ui" class="layer"></div>
<canvas id="fx2" width="1920" height="1080"></canvas>
<div id="light" class="layer" style="display:none"></div>
<div id="txt" class="layer"></div>
<div id="caption"></div>
<div id="flash"></div>
<div id="black"></div>
</div>
<script>
const W=1920,H=1080,FPS=30;
const C={text:'#ECECEC',text2:'#A1A1A1',text3:'#6E6E6E',amber:'#F5A13C',amberSoft:'#FFC98A',green:'#4CC38A',cold:'#9FB0C2',gray:'#8C9097',fill:'#111112'};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eOut=p=>1-Math.pow(1-p,3), eIn=p=>p*p*p, eInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
const eBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
let TALK=[];

/* ---------------- mascot ---------------- */
const ACC={
 hardhat(c,ctx){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(23,50);ctx.bezierCurveTo(23,12,97,12,97,50);ctx.closePath();ctx.fill();
   ctx.strokeStyle=c;ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(14,50);ctx.lineTo(106,50);ctx.stroke();
   ctx.fillStyle='rgba(0,0,0,.22)';rr(ctx,56,20,8,26,4);ctx.fill();},
 beret(c,ctx){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(22,44);ctx.bezierCurveTo(14,30,38,15,64,17);ctx.bezierCurveTo(92,19,106,31,99,42);ctx.bezierCurveTo(92,51,30,53,22,44);ctx.closePath();ctx.fill();
   ctx.strokeStyle=c;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(70,17);ctx.lineTo(75,9);ctx.stroke();},
 glasses(c,ctx){ctx.strokeStyle=c;ctx.lineWidth=3.5;ctx.lineCap='round';for(const x of [47.5,72.5]){ctx.beginPath();ctx.arc(x,75,11.5,0,7);ctx.stroke();}
   ctx.beginPath();ctx.moveTo(36,73);ctx.lineTo(25,70);ctx.moveTo(84,73);ctx.lineTo(95,70);ctx.stroke();},
 crown(c,ctx){ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=3;ctx.lineJoin='round';ctx.beginPath();[[38,41],[33,12],[47,25],[60,6],[73,25],[87,12],[82,41]].forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();ctx.stroke();
   ctx.fillStyle='#141414';ctx.beginPath();ctx.arc(60,30,4,0,7);ctx.fill();},
 headset(c,ctx){ctx.strokeStyle=c;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(17,78);ctx.bezierCurveTo(17,18,103,18,103,78);ctx.stroke();
   ctx.fillStyle=c;rr(ctx,9,66,16,26,7);ctx.fill();rr(ctx,95,66,16,26,7);ctx.fill();
   ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(17,90);ctx.bezierCurveTo(17,110,30,112,40,108);ctx.stroke();ctx.beginPath();ctx.arc(43.5,107.5,5.5,0,7);ctx.fill();},
 monocle(c,ctx){ctx.strokeStyle=c;ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(72.5,75,12.5,0,7);ctx.stroke();
   ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(84,82);ctx.bezierCurveTo(94,96,97,108,91,120);ctx.stroke();
   ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(43,119);ctx.lineTo(58,126);ctx.lineTo(43,133);ctx.closePath();ctx.moveTo(77,119);ctx.lineTo(62,126);ctx.lineTo(77,133);ctx.closePath();ctx.fill();rr(ctx,56,122,8,8,2);ctx.fill();},
 magnifier(c,ctx){ctx.fillStyle=hexA(c,.18);ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.arc(94,98,14,0,7);ctx.fill();ctx.stroke();
   ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(105,109);ctx.lineTo(114,120);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(94,98,3,4,0,0,7);ctx.fill();},
 shades(c,ctx){ctx.fillStyle='#0B0B0B';ctx.strokeStyle='#ECECEC';ctx.lineWidth=2.5;ctx.lineJoin='round';
   for(const x of [34,61]){ctx.beginPath();ctx.moveTo(x,68);ctx.lineTo(x+25,68);ctx.lineTo(x+25,76);ctx.bezierCurveTo(x+25,82,x+21,85,x+13,85);ctx.bezierCurveTo(x+5,85,x,81,x,76);ctx.closePath();ctx.fill();ctx.stroke();}
   ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(31,68);ctx.lineTo(89,68);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.arc(99.5,74.5,4.5,0,7);ctx.fill();},
 wrench(c,ctx){ctx.strokeStyle=c;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(116,98);ctx.bezierCurveTo(116,103,112,107,107,107);ctx.bezierCurveTo(102,107,98,103,98,98);ctx.bezierCurveTo(98,93,102,89,107,89);ctx.stroke();
   ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(100,105);ctx.lineTo(86,119);ctx.stroke();},
};
// x,y = screen position of body centre; s = px per buddy unit
function drawBuddy(ctx,x,y,s,o={}){
  const a=(o.alpha??1); if(a<=0.004||s<=0.01) return;
  ctx.save(); ctx.globalAlpha*=a; ctx.translate(x,y); if(o.rot) ctx.rotate(o.rot);
  ctx.scale(s*(o.sx??1),s*(o.sy??1)); ctx.translate(-60,-80);
  const col=o.color||C.text;
  ctx.lineJoin='round';ctx.lineCap='butt';
  ctx.beginPath();ctx.moveTo(25,121);ctx.lineTo(25,74);ctx.arc(60,74,35,Math.PI,0);ctx.lineTo(95,121);ctx.closePath();
  ctx.fillStyle=o.fill||C.fill; ctx.fill();
  if(o.glow){ctx.shadowColor=o.glowColor||C.amber;ctx.shadowBlur=o.glow;}
  ctx.lineWidth=10; ctx.strokeStyle=col; ctx.stroke(); ctx.shadowBlur=0;
  // eyes
  const lx=o.look||0, ly=o.lookY||0, ey=75+ly;
  const ev=Array.isArray(o.eyes)?o.eyes:[o.eyes||'open',o.eyes||'open'];
  ctx.fillStyle=col;ctx.strokeStyle=col;
  [47.5+lx,72.5+lx].forEach((cx,i)=>{
    const e=ev[i];
    if(e==='happy'){ctx.lineWidth=4.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-6,ey+3);ctx.quadraticCurveTo(cx,ey-8,cx+6,ey+3);ctx.stroke();}
    else{const h=Math.max(3.5,18*(1-(o.blink||0))*(e==='half'?0.55:1));rr(ctx,cx-3.5,ey-h/2,7,h,3.5);ctx.fill();}
  });
  // mouth (ember slot)
  const mc=o.mouthColor||col, mx=60+lx*0.6, my=98.5+ly*0.4;
  if(o.mouth==='smile'){ctx.strokeStyle=mc;ctx.lineWidth=5.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(mx-12,my-4);ctx.quadraticCurveTo(mx,my+10,mx+12,my-4);ctx.stroke();}
  else{const tk=o.talk||0;const w=26-8*tk,h=9+9*tk;ctx.fillStyle=mc;if(o.mouthGlow){ctx.shadowColor=mc;ctx.shadowBlur=o.mouthGlow;}rr(ctx,mx-w/2,my-h/2,w,h,3+tk*3);ctx.fill();ctx.shadowBlur=0;}
  if(o.acc&&ACC[o.acc]&&(o.accP??1)>0){const p=o.accP??1;ctx.save();ctx.globalAlpha*=clamp(p*1.4);ctx.translate(60,60);ctx.scale(lerp(.6,1,eBack(p)),lerp(.6,1,eBack(p)));ctx.translate(-60,-60+(1-p)*-18);
    if(o.accGlow){ctx.shadowColor=o.accColor;ctx.shadowBlur=o.accGlow;}ACC[o.acc](o.accColor||C.amber,ctx);ctx.restore();}
  ctx.restore();
}
function buddySVG(acc,c,size,mouth){ // small inline face for DOM panels
  const accs={hardhat:`<path d="M23 50C23 12 97 12 97 50Z" fill="${c}"/><path d="M14 50H106" stroke="${c}" stroke-width="9" stroke-linecap="round"/>`,
   beret:`<path d="M22 44C14 30 38 15 64 17C92 19 106 31 99 42C92 51 30 53 22 44Z" fill="${c}"/>`,
   glasses:`<g fill="none" stroke="${c}" stroke-width="4"><circle cx="47.5" cy="75" r="11.5"/><circle cx="72.5" cy="75" r="11.5"/></g>`,
   magnifier:`<circle cx="94" cy="98" r="14" fill="none" stroke="${c}" stroke-width="6"/><path d="M105 109L114 120" stroke="${c}" stroke-width="8" stroke-linecap="round"/>`,
   monocle:`<circle cx="72.5" cy="75" r="12.5" fill="none" stroke="${c}" stroke-width="4"/>`,
   crown:`<path d="M38 41L33 12L47 25L60 6L73 25L87 12L82 41Z" fill="${c}"/>`};
  return `<svg width="${size}" height="${size*140/120}" viewBox="0 0 120 140"><path d="M25 121V74A35 35 0 0 1 95 74V121Z" fill="${mouth==='light'?'#fff':'#111'}" stroke="${mouth==='light'?'#0D0D0D':'#ECECEC'}" stroke-width="11" stroke-linejoin="round"/><rect x="43.5" y="66" width="8" height="18" rx="4" fill="${mouth==='light'?'#0D0D0D':'#ECECEC'}"/><rect x="68.5" y="66" width="8" height="18" rx="4" fill="${mouth==='light'?'#0D0D0D':'#ECECEC'}"/><rect x="47" y="94" width="26" height="10" rx="3" fill="#F5A13C"/>${accs[acc]||''}</svg>`;
}

/* ---------------- crowd ---------------- */
const ROLES=[
 {r:'Engineer',acc:'hardhat',c:C.amber},{r:'Designer',acc:'beret',c:C.amberSoft},{r:'Researcher',acc:'glasses',c:C.cold},
 {r:'Backend',acc:'hardhat',c:C.gray},{r:'QA',acc:'magnifier',c:C.green},{r:'Product',acc:'crown',c:C.amberSoft},
 {r:'Security',acc:'shades',c:C.gray},{r:'Reviewer',acc:'monocle',c:C.cold},{r:'PM',acc:'headset',c:C.cold},{r:'Integrator',acc:'wrench',c:C.gray}];
const CROWD=[];
(function(){const R=rng(7);const rows=[[150,6],[320,8],[520,10],[740,11],[980,12],[1240,13],[1520,14]];let k=0;
 rows.forEach(([z,n],ri)=>{const span=900+ri*260;for(let i=0;i<n;i++){let x=-span+(2*span)*(i+.5)/n+(R()-.5)*span/n*.7;
   if(ri<2&&Math.abs(x)<230) x+= x<0?-200:200;
   const role=ROLES[(k*7+ri*3)%ROLES.length];
   CROWD.push({x,y:0,z:z+(R()-.5)*60,role,ph:R()*6.28,blinkT:R()*4,look:(R()-.5)*8,screen:null,id:k});k++;}});
 // mini screens on a few near agents
 const near=CROWD.filter(a=>a.z<560).sort((a,b)=>Math.abs(a.x)-Math.abs(b.x));
 const kinds=['code','tasks','notes','qa','code','design'];
 near.slice(0,6).forEach((a,i)=>a.screen=kinds[i]);
 CROWD.forEach(a=>{a.dist=Math.hypot(a.x,a.z*1.3);});
})();
const LINKS=(function(){ // pairs by index of near agents
  const near=CROWD.filter(a=>a.z<900).sort((a,b)=>a.dist-b.dist);
  const L=[];for(let i=0;i<14;i++){const A=near[i],B=near[(i*5+3)%near.length];if(A!==B)L.push([A,B,i]);}return L;})();

function proj(p,cam){
  let x=p.x, z=p.z-cam.pz; const cs=Math.cos(cam.yaw), sn=Math.sin(cam.yaw);
  const xr=x*cs-z*sn, zr=x*sn+z*cs+cam.pz;
  const zz=zr+cam.d; if(zz<30) return null;
  const s=cam.F/zz;
  return {x:W/2+(xr-cam.cx)*s, y:cam.hy+(p.y-cam.camY)*s, s, z:zz};
}
function miniScreen(ctx,kind,x,y,s,t,a){
  const w=150*s,h=96*s; ctx.save();ctx.globalAlpha*=a;
  ctx.fillStyle='#171717';ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;rr(ctx,x,y,w,h,7*s);ctx.fill();ctx.stroke();
  ctx.fillStyle=C.text3;ctx.font=`500 ${9*s}px JBM`;
  const head={code:'RUNHEADER.SWIFT',tasks:'TASKS · T1–T4',notes:'RESEARCH.MD',qa:'QA STATUS',design:'APPROVE · BUTTON'}[kind];
  ctx.fillText(head,x+9*s,y+16*s);
  ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(x,y+23*s,w,1);
  const lines={code:[[C.amber,'struct'],[C.text2,'  let run'],[C.text2,'  var body'],[C.text3,'  // split']],
    tasks:[[C.green,'✓ T1 ADR-03'],[C.green,'✓ T2 contract'],[C.amber,'● T3 header'],[C.text3,'○ T4 tests']],
    notes:[[C.text2,'• 4–6 receipts/s'],[C.text2,'• rerender on each'],[C.amber,'→ split state'],[C.text3,'→ to Product']],
    qa:[[C.text2,'ReceiptStateTests'],[C.green,'11 passed'],[C.amber,'1 running'],[C.text3,'seq 418']],
    design:[[C.text2,'Approve'],[C.text3,'h 32 · r 10'],[C.amber,'● hover'],[C.text3,'state: idle']]}[kind];
  const shown=Math.floor(clamp((t*6)%8,0,4.99));
  ctx.font=`400 ${9.5*s}px JBM`;
  lines.forEach((l,i)=>{if(i>shown)return;ctx.fillStyle=l[0];ctx.fillText(l[1],x+9*s,y+(38+i*15)*s);});
  ctx.restore();
}
function label(ctx,x,y,text,dot,a,size=13){
  if(a<=0.01)return; ctx.save();ctx.globalAlpha*=a;ctx.font=`500 ${size}px JBM`;ctx.letterSpacing='0.06em';
  const tw=ctx.measureText(text).width, w=tw+size*2.1, h=size*1.9;
  ctx.fillStyle='rgba(23,23,23,.92)';ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;rr(ctx,x-w/2,y-h/2,w,h,h/2);ctx.fill();ctx.stroke();
  ctx.fillStyle=dot||C.text3;ctx.beginPath();ctx.arc(x-w/2+size*0.85,y,size*0.22,0,7);ctx.fill();
  ctx.fillStyle=C.text2;ctx.textBaseline='middle';ctx.fillText(text,x-w/2+size*1.35,y+1);ctx.restore();
}
function drawCrowd(ctx,t,cam,opt={}){
  const items=[];
  for(const a of CROWD){const p=proj(a,cam);if(!p)continue;
    const appear=opt.appear?opt.appear(a):1; if(appear<=0)continue;
    items.push({a,p,appear});}
  items.sort((u,v)=>v.p.z-u.p.z);
  for(const {a,p,appear} of items){
    const s=p.s; if(p.x<-300||p.x>W+300) continue;
    let alpha=appear*(opt.alpha?opt.alpha(a,p):1);
    // depth fade
    alpha*=clamp(1.25-p.z/3200,0.35,1);
    const bob=Math.sin(t*2.2+a.ph)*2*s;
    const bl=((t+a.blinkT)%3.7)<0.12?1:0;
    const work=Math.sin(t*1.3+a.ph)>0.2;
    // materialize particles
    if(appear<1){const R=rng(a.id+11);ctx.save();ctx.strokeStyle=hexA(C.amber,.7*(1-appear));ctx.lineWidth=1.5;
      for(let k=0;k<7;k++){const ang=R()*6.28,dist=(1-eOut(appear))*120*s+10*s;const px=p.x+Math.cos(ang)*dist,py=p.y+Math.sin(ang)*dist;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(ang)*14*s,py+Math.sin(ang)*14*s);ctx.stroke();}ctx.restore();}
    drawBuddy(ctx,p.x,p.y+bob,s*lerp(.7,1,eBack(clamp(appear))),{alpha,acc:a.role.acc,accColor:a.role.c,blink:bl,look:work?a.look:0,lookY:work?3:0,
      mouth:(Math.sin(t*.9+a.ph)>0.85)?'smile':'bar',mouthColor:work&&a.role.r==='Engineer'?C.amber:undefined});
    if(a.screen&&opt.screens){const sa=opt.screens*appear; if(sa>0.01) miniScreen(ctx,a.screen,p.x+(a.x>0?-215:62)*s,p.y-70*s,s,t+a.ph,sa);}
    if(opt.labels&&p.z<opt.labelZ){const la=opt.labels*appear*clamp((opt.labelZ-p.z)/300);label(ctx,p.x,p.y-82*s-14,a.role.r.toUpperCase(),a.role.c,la,clamp(11*s+4,11,15));}
    a._p=p;
  }
}

/* ---------------- background ---------------- */
function drawBg(ctx,t,o){
  ctx.fillStyle=o.base;ctx.fillRect(0,0,W,H);
  if(o.glow>0){const g=ctx.createRadialGradient(o.gx??W/2,o.gy??H/2,0,o.gx??W/2,o.gy??H/2,o.gr||600);
    g.addColorStop(0,hexA(C.amber,o.glow));g.addColorStop(.35,hexA(C.amber,o.glow*.35));g.addColorStop(1,hexA(C.amber,0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(o.vig){const g=ctx.createRadialGradient(W/2,H/2,300,W/2,H/2,1150);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${o.vig})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(o.grid>0){ // perspective floor lines
    ctx.save();ctx.strokeStyle=`rgba(255,255,255,${0.05*o.grid})`;ctx.lineWidth=1;const hz=o.hz??560;
    for(let i=-14;i<=14;i++){ctx.beginPath();ctx.moveTo(W/2+i*40,hz);ctx.lineTo(W/2+i*520,H+40);ctx.stroke();}
    for(let j=0;j<9;j++){const y=hz+Math.pow(j/8,2.2)*(H-hz+40);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.restore();}
}

/* ---------------- DOM builders ---------------- */
const $=s=>document.querySelector(s);
const ui=$('#ui'), txt=$('#txt'), light=$('#light');
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||document.body).appendChild(e);return e;}
const T={};
function buildTitles(){
