name: Project preparation
on:
  push:
    branches: [main, 'codex/**', 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing
  java-configuration:
    name: Gradle configuration (server code not implemented)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: backend/gradlew -p backend projects
      - run: backend/gradlew -p backend spotlessCheck
  apple-build:
    runs-on: [self-hosted, macOS, ARM64, xcode-27]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project apps/Kiln.xcodeproj -scheme KilnMac -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project apps/Kiln.xcodeproj -scheme KilnIOS -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode-ios CODE_SIGNING_ALLOWED=NO build
